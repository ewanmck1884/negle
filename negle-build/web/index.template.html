<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Negle</title>
<style>
  :root{
    --bg:#0f1720; --panel:#182430; --panel2:#1f2e3d; --accent:#5ec9a6; --accent2:#e0b354;
    --text:#eaf2f0; --muted:#8fa3af; --bad:#e0685e; --border:#2b3b48; --ring2:#4a6272;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f7f6; --panel:#ffffff; --panel2:#eef3f2; --accent:#1e8f6f; --accent2:#a3701a;
      --text:#16211f; --muted:#5b6f6c; --bad:#c0392b; --border:#dbe4e2; --ring2:#9db3af;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --panel:#182430; --panel2:#1f2e3d; --accent:#5ec9a6; --accent2:#e0b354;
    --text:#eaf2f0; --muted:#8fa3af; --bad:#e0685e; --border:#2b3b48; --ring2:#4a6272;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; justify-content:center; padding:24px 12px;
  }
  .wrap{width:100%; max-width:600px;}
  h1{font-size:28px; letter-spacing:2px; text-align:center; margin:0 0 2px; font-weight:800; color:var(--accent);}
  .sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:18px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:16px;}
  .stage{
    position:relative; width:100%; aspect-ratio:1/1; max-width:420px; margin:0 auto;
    background:var(--panel2); border-radius:14px; overflow:hidden;
  }
  .dot{
    position:absolute; border-radius:50%; background:var(--accent);
    transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
  }
  .dot.ring2{background:var(--ring2); opacity:0.7;}
  .lbl{
    position:absolute; transform:translate(-50%, 4px); font-size:11px; color:var(--text);
    white-space:nowrap; font-weight:600; text-shadow:0 1px 3px var(--panel2);
  }
  .lbl.ring2{color:var(--muted); font-weight:500; font-size:10px;}
  .target-mark{
    position:absolute; width:34px; height:34px; border-radius:50%; border:2px dashed var(--accent2);
    transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
    font-size:15px; color:var(--accent2); left:50%; top:50%;
  }
  .meta-row{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:10px;}
  .hint-box{
    margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--panel2);
    border:1px dashed var(--border); font-size:13px; color:var(--accent2); display:none;
  }
  .hint-box.show{display:block;}
  .guess-row{display:flex; gap:8px; margin-top:14px;}
  input[type=text]{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:15px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  button{padding:11px 18px; border-radius:10px; border:none; background:var(--accent); color:#08211a; font-weight:700; font-size:14px; cursor:pointer;}
  button:disabled{opacity:0.5; cursor:default;}
  button.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  .history{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .guess-item{
    display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:9px 12px; font-size:13px;
  }
  .guess-item .name{font-weight:600;}
  .arrow{font-size:16px; color:var(--accent2);}
  .badge{font-size:11px; padding:3px 8px; border-radius:20px; background:var(--border); color:var(--muted);}
  .badge.hot{background:rgba(224,104,94,0.18); color:var(--bad);}
  .badge.warm{background:rgba(224,179,84,0.18); color:var(--accent2);}
  .badge.cold{background:rgba(94,201,166,0.18); color:var(--accent);}
  .win-banner{text-align:center; padding:14px; border-radius:12px; background:rgba(94,201,166,0.15); border:1px solid var(--accent); margin-top:14px; display:none;}
  .win-banner h3{margin:0 0 4px; color:var(--accent); font-size:18px;}
  .footer-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:8px; flex-wrap:wrap;}
  .stat{font-size:12px; color:var(--muted);}
  .stat b{color:var(--text); font-size:15px;}
  .mode-row{display:flex; justify-content:center; gap:8px; margin-bottom:14px;}
  .mode-btn{
    padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--panel);
    color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;
  }
  .mode-btn.active{background:var(--accent); color:#08211a; border-color:var(--accent);}
  .share-row{display:flex; gap:8px; margin-top:10px;}
  .share-row button{flex:1;}
  #shareBtn{background:var(--panel2); color:var(--text); border:1px solid var(--accent); }
  #shareBtn.copied{background:var(--accent); color:#08211a; border-color:var(--accent);}
  .guess-dots{text-align:center; font-size:20px; letter-spacing:4px; margin:10px 0 0;}
  .stats-btn{
    position:absolute; top:0; right:0; background:none; border:none; color:var(--muted);
    font-size:20px; padding:4px 8px; cursor:pointer;
  }
  .title-row{position:relative;}
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55);
    align-items:center; justify-content:center; padding:16px; z-index:10;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:20px; width:100%; max-width:380px; position:relative;
  }
  .modal h2{margin:0 0 14px; font-size:18px; text-align:center; color:var(--accent);}
  .modal-close{
    position:absolute; top:12px; right:14px; background:none; border:none;
    color:var(--muted); font-size:18px; padding:0; cursor:pointer;
  }
  .stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px;}
  .stats-grid div{text-align:center;}
  .stats-grid .num{font-size:24px; font-weight:800; color:var(--text);}
  .stats-grid .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
  .dist-row{display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12px;}
  .dist-row .n{width:10px; color:var(--muted);}
  .dist-row .bar{flex:1; background:var(--panel2); border-radius:4px; overflow:hidden; height:18px;}
  .dist-row .fill{background:var(--accent); height:100%; min-width:18px; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; color:#08211a; font-weight:700; font-size:11px;}
  .dist-row .fill.zero{background:var(--panel2); min-width:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <h1>NEGLE</h1>
    <button class="stats-btn" id="statsBtn" title="Stats">📊</button>
  </div>
  <div class="sub">its neighbors are all in place. the country itself is a blank. name what's missing.</div>

  <div class="mode-row">
    <button class="mode-btn active" id="dailyModeBtn">Daily #<span id="puzzleNum"></span></button>
    <button class="mode-btn" id="practiceModeBtn">Practice (random)</button>
  </div>

  <div class="card">
    <div class="stage" id="stage">
      <div class="target-mark">?</div>
    </div>
    <div class="meta-row">
      <span id="ringinfo">1st-ring neighbors shown</span>
      <span id="guessnum">guess 1</span>
    </div>
    <div class="hint-box" id="hintLetters"></div>
    <div class="hint-box" id="hintSize"></div>

    <div class="guess-row">
      <input type="text" id="guessInput" placeholder="Type a country..." list="countryList" autocomplete="off">
      <button id="guessBtn">Guess</button>
    </div>
    <datalist id="countryList"></datalist>

    <div class="history" id="history"></div>

    <div class="win-banner" id="winBanner">
      <h3 id="winTitle"></h3>
      <div id="winSub" class="stat"></div>
      <div class="share-row">
        <button id="shareBtn">📋 Copy result</button>
      </div>
    </div>

    <div class="footer-row">
      <div class="stat">Guesses: <b id="guessCount">0</b>/6</div>
      <button class="secondary" id="giveUpBtn">Give up</button>
      <button id="newGameBtn" style="display:none;">Play again</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statsOverlay">
  <div class="modal">
    <button class="modal-close" id="statsClose">✕</button>
    <h2>Statistics</h2>
    <div class="stats-grid">
      <div><div class="num" id="statPlayed">0</div><div class="lbl">Played</div></div>
      <div><div class="num" id="statWinPct">0</div><div class="lbl">Win %</div></div>
      <div><div class="num" id="statStreak">0</div><div class="lbl">Streak</div></div>
      <div><div class="num" id="statMaxStreak">0</div><div class="lbl">Max streak</div></div>
    </div>
    <div id="statDist"></div>
  </div>
</div>

<script>
const DATA = __DATA__;
const byName = {};
DATA.countries.forEach(c => byName[c.name] = c);

let target, guesses, done, ring2shown;

function haversine(c1, c2){
  const R = 6371;
  const [lon1,lat1] = c1, [lon2,lat2] = c2;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
function bearing(c1, c2){
  const [lon1,lat1] = c1, [lon2,lat2] = c2;
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}
function bearingArrow(deg){
  const arrows = ['↑','↗','→','↘','↓','↙','←','↖'];
  return arrows[Math.round(deg/45) % 8];
}
function badgeClass(dist){
  if (dist < 600) return 'hot';
  if (dist < 2500) return 'warm';
  return 'cold';
}
function localXY(centroid, origin){
  const [lon, lat] = centroid, [lon0, lat0] = origin;
  const x = (lon - lon0) * Math.cos(lat0 * Math.PI/180);
  const y = (lat0 - lat);
  return [x, y];
}
function letterHint(name){
  let seen = false;
  return name.split('').map(ch => {
    if (/[a-zA-Z]/.test(ch)){
      if (!seen){ seen = true; return ch; }
      return '_';
    }
    return ch;
  }).join('');
}
const SIZE_REFS = [
  {name:'Russia', km2:17098246},{name:'Canada', km2:9984670},{name:'China', km2:9596960},
  {name:'the United States', km2:9147420},{name:'Brazil', km2:8515767},{name:'India', km2:3287263},
  {name:'Kazakhstan', km2:2724900},{name:'Algeria', km2:2381741},{name:'Mexico', km2:1964375},
  {name:'Egypt', km2:1002450},{name:'France', km2:551695},{name:'Thailand', km2:513120},
  {name:'Spain', km2:505990},{name:'Germany', km2:357022},{name:'Japan', km2:377975},
  {name:'the United Kingdom', km2:243610},{name:'Nepal', km2:147181},{name:'Portugal', km2:92212},
  {name:'Switzerland', km2:41285},{name:'the Netherlands', km2:41543},{name:'Belgium', km2:30528},
  {name:'Jamaica', km2:10991}
];
function sizeHint(km2, excludeName){
  let best = null, bestScore = Infinity;
  for (const r of SIZE_REFS){
    if (r.name === excludeName) continue;
    const score = Math.abs(Math.log(km2) - Math.log(r.km2));
    if (score < bestScore){ bestScore = score; best = r; }
  }
  return "Roughly the size of " + best.name + " (~" + km2.toLocaleString() + " km²)";
}

function layout(){
  const stage = document.getElementById('stage');
  stage.querySelectorAll('.dot,.lbl').forEach(el => el.remove());
  const w = stage.clientWidth, h = stage.clientHeight;
  const cx = w/2, cy = h/2;

  const ring1 = target.neighbors.map(n => ({...n, ring:1}));
  let ring2 = [];
  if (ring2shown){
    const shownNames = new Set([target.name, ...ring1.map(n=>n.name)]);
    target.neighbors.forEach(n => {
      const rec = byName[n.name];
      if (!rec) return;
      rec.neighbors.forEach(n2 => {
        if (!shownNames.has(n2.name)){
          shownNames.add(n2.name);
          ring2.push({...n2, ring:2});
        }
      });
    });
  }

  const all = [...ring1, ...ring2];
  const pts = all.map(n => localXY(n.centroid, target.centroid));
  const maxAbs = Math.max(0.5, ...pts.map(p => Math.max(Math.abs(p[0]), Math.abs(p[1]))));
  const scale = (Math.min(w,h) * 0.40) / maxAbs;

  all.forEach((n, idx) => {
    const [x, y] = pts[idx];
    const px = cx + x * scale, py = cy + y * scale;
    const dot = document.createElement('div');
    dot.className = 'dot' + (n.ring===2 ? ' ring2' : '');
    const size = n.ring===2 ? 7 : 11;
    dot.style.width = size+'px'; dot.style.height = size+'px';
    dot.style.left = px+'px'; dot.style.top = py+'px';
    stage.appendChild(dot);

    const lbl = document.createElement('div');
    lbl.className = 'lbl' + (n.ring===2 ? ' ring2' : '');
    lbl.style.left = px+'px'; lbl.style.top = py+'px';
    lbl.textContent = n.name;
    stage.appendChild(lbl);
  });
}

const MAX_GUESSES = 6;
const EPOCH = new Date('2025-01-01T00:00:00Z');

function dailyPuzzleNumber(){
  const now = new Date();
  const utcToday = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.floor((utcToday - Date.UTC(2025,0,1)) / 86400000);
  return Math.max(1, diffDays + 1);
}
function dailyTargetName(){
  const n = dailyPuzzleNumber();
  // simple deterministic hash so the sequence isn't just index order
  let h = 0;
  const s = 'negle-' + n;
  for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return DATA.targets[h % DATA.targets.length];
}

let isDaily = true;

function newGame(daily){
  isDaily = daily;
  const name = daily ? dailyTargetName() : DATA.targets[Math.floor(Math.random()*DATA.targets.length)];
  target = byName[name];
  guesses = [];
  done = false;
  ring2shown = false;
  document.getElementById('history').innerHTML = '';
  document.getElementById('winBanner').style.display = 'none';
  document.getElementById('hintLetters').className = 'hint-box';
  document.getElementById('hintSize').className = 'hint-box';
  document.getElementById('guessInput').disabled = false;
  document.getElementById('guessBtn').disabled = false;
  document.getElementById('guessInput').value = '';
  document.getElementById('newGameBtn').style.display = 'none';
  document.getElementById('giveUpBtn').style.display = 'inline-block';
  document.getElementById('ringinfo').textContent = '1st-ring neighbors shown';
  document.getElementById('shareBtn').textContent = '📋 Copy result';
  document.getElementById('shareBtn').classList.remove('copied');
  document.getElementById('dailyModeBtn').classList.toggle('active', daily);
  document.getElementById('practiceModeBtn').classList.toggle('active', !daily);
  document.getElementById('puzzleNum').textContent = dailyPuzzleNumber();
  updateMeta();
  layout();
}
function updateMeta(){
  document.getElementById('guessnum').textContent = 'guess ' + (guesses.length+1) + ' / ' + MAX_GUESSES;
  document.getElementById('guessCount').textContent = guesses.length;
}
function findCountry(input){
  const norm = s => s.toLowerCase().replace(/^the\s+/,'').replace(/[^a-z]/g,'');
  const n = norm(input);
  return DATA.countries.find(c => norm(c.name) === n) ||
         DATA.countries.find(c => norm(c.name).includes(n) && n.length > 3);
}
function renderHistory(){
  const el = document.getElementById('history');
  el.innerHTML = guesses.slice().reverse().map(g => {
    if (g.correct){
      return '<div class="guess-item"><span class="name">'+g.name+'</span><span class="badge hot">exact match</span><span class="arrow">🎯</span></div>';
    }
    return '<div class="guess-item">'+
      '<span class="name">'+g.name+'</span>'+
      '<span class="badge '+badgeClass(g.dist)+'">'+g.dist.toLocaleString()+' km</span>'+
      '<span class="arrow">'+bearingArrow(g.brg)+'</span></div>';
  }).join('');
}
function submitGuess(){
  if (done) return;
  const val = document.getElementById('guessInput').value.trim();
  if (!val) return;
  const match = findCountry(val);
  if (!match){ alert("Don't recognize that one — try the full country name."); return; }
  if (guesses.find(g => g.name === match.name)){ document.getElementById('guessInput').value=''; return; }

  const dist = haversine(match.centroid, target.centroid);
  const brg = bearing(match.centroid, target.centroid);
  const correct = match.name === target.name;
  guesses.push({name: match.name, dist, brg, correct});
  renderHistory();
  document.getElementById('guessInput').value = '';
  updateMeta();

  if (correct){ endGame(true); return; }

  const n = guesses.length;
  if (n === 1){
    ring2shown = true;
    document.getElementById('ringinfo').textContent = '2nd-ring neighbors added';
    layout();
  } else if (n === 2){
    const box = document.getElementById('hintLetters');
    box.textContent = 'Hint: ' + letterHint(target.name);
    box.className = 'hint-box show';
  } else if (n === 3){
    const box = document.getElementById('hintSize');
    box.textContent = 'Hint: ' + sizeHint(target.areaKm2, target.name);
    box.className = 'hint-box show';
  }

  if (n >= MAX_GUESSES){ endGame(false); }
}
function squareFor(g){
  if (g.correct) return '🟩';
  if (g.dist < 600) return '🟧';
  if (g.dist < 2500) return '🟨';
  return '⬜';
}
function buildShareText(won){
  const label = isDaily ? ('Negle #' + dailyPuzzleNumber()) : 'Negle (practice)';
  const score = won ? (guesses.length + '/' + MAX_GUESSES) : ('X/' + MAX_GUESSES);
  const squares = guesses.map(squareFor).join('');
  return label + '\n' + score + '\n' + squares + '\n' + window.location.href;
}
function copyResult(){
  const text = buildShareText(guesses.length > 0 && guesses[guesses.length-1].correct);
  const btn = document.getElementById('shareBtn');
  const done = () => { btn.textContent = '✅ Copied!'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='📋 Copy result'; btn.classList.remove('copied');}, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ alert(text); }
  document.body.removeChild(ta);
}
function endGame(won){
  done = true;
  document.getElementById('guessInput').disabled = true;
  document.getElementById('guessBtn').disabled = true;
  document.getElementById('giveUpBtn').style.display = 'none';
  document.getElementById('newGameBtn').style.display = 'inline-block';
  const banner = document.getElementById('winBanner');
  banner.style.display = 'block';
  document.getElementById('winTitle').textContent = won ? '🎯 ' + target.name + '!' : 'It was ' + target.name;
  document.getElementById('winSub').textContent = won ? ('Solved in ' + guesses.length + ' guess' + (guesses.length===1?'':'es')) : 'Better luck next time';

  if (isDaily){
    const recorded = recordDailyResult(won, guesses.length);
    if (recorded) openStats();
  }
}

const STATS_KEY = 'negle-stats';
function loadStats(){
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return {gamesPlayed:0, gamesWon:0, currentStreak:0, maxStreak:0, guessDistribution:[0,0,0,0,0,0], lastPuzzleNum:null};
}
function saveStats(stats){
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch(e){}
}
function recordDailyResult(won, guessCount){
  const stats = loadStats();
  const puzzleNum = dailyPuzzleNumber();
  if (stats.lastPuzzleNum === puzzleNum) return false; // already recorded today

  stats.gamesPlayed += 1;
  if (won){
    stats.gamesWon += 1;
    stats.currentStreak = (stats.lastPuzzleNum === puzzleNum - 1) ? stats.currentStreak + 1 : 1;
    stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
    stats.guessDistribution[guessCount-1] += 1;
  } else {
    stats.currentStreak = 0;
  }
  stats.lastPuzzleNum = puzzleNum;
  saveStats(stats);
  return true;
}
function renderStats(){
  const stats = loadStats();
  const winPct = stats.gamesPlayed ? Math.round(100 * stats.gamesWon / stats.gamesPlayed) : 0;
  document.getElementById('statPlayed').textContent = stats.gamesPlayed;
  document.getElementById('statWinPct').textContent = winPct;
  document.getElementById('statStreak').textContent = stats.currentStreak;
  document.getElementById('statMaxStreak').textContent = stats.maxStreak;
  const maxCount = Math.max(1, ...stats.guessDistribution);
  document.getElementById('statDist').innerHTML = stats.guessDistribution.map((count, i) => {
    const pct = Math.round(100 * count / maxCount);
    return '<div class="dist-row"><span class="n">'+(i+1)+'</span>'+
      '<div class="bar"><div class="fill'+(count===0?' zero':'')+'" style="width:'+(count===0?0:pct)+'%">'+(count||'')+'</div></div></div>';
  }).join('');
}
function openStats(){
  renderStats();
  document.getElementById('statsOverlay').classList.add('show');
}
function closeStats(){
  document.getElementById('statsOverlay').classList.remove('show');
}

document.getElementById('guessBtn').addEventListener('click', submitGuess);
document.getElementById('guessInput').addEventListener('keydown', e => { if(e.key==='Enter') submitGuess(); });
document.getElementById('shareBtn').addEventListener('click', copyResult);
document.getElementById('dailyModeBtn').addEventListener('click', () => newGame(true));
document.getElementById('practiceModeBtn').addEventListener('click', () => newGame(false));
document.getElementById('giveUpBtn').addEventListener('click', () => endGame(false));
document.getElementById('newGameBtn').addEventListener('click', () => newGame(isDaily));
document.getElementById('statsBtn').addEventListener('click', openStats);
document.getElementById('statsClose').addEventListener('click', closeStats);
document.getElementById('statsOverlay').addEventListener('click', e => { if (e.target.id === 'statsOverlay') closeStats(); });
window.addEventListener('resize', () => { layout(); });

document.getElementById('countryList').innerHTML = DATA.countries.map(c => '<option value="'+c.name+'">').join('');

newGame(true);
</script>
</body>
</html>
